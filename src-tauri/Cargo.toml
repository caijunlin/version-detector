[package]
name = "version-detector"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
ecb = { version = "0.2.1", features = ["alloc"] }
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate"] }
aes = "0.9.3"
cipher = { version = "0.5.2", features = ["alloc", "block-padding"] }
block-padding = "0.4.2"
reqwest = { version = "0.13.5", features = ["json"] }
indexmap = { version = "2.0", features = ["serde"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
